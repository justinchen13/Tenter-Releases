name: Bug report
description: Report something that is not working as expected.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This issue and its attachments will be public. Remove sensitive information before submitting.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe what you were doing and the actual result.
    validations:
      required: true
  - type: textarea
    id: expected_result
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to reproduce
      description: If you can reproduce the problem, list the steps here.
    validations:
      required: false
  - type: input
    id: app_version
    attributes:
      label: Tenter version
    validations:
      required: false
  - type: input
    id: system
    attributes:
      label: Operating system and version
    validations:
      required: false
  - type: input
    id: model_service
    attributes:
      label: Model service and model
      description: Include these only if they are relevant and known.
    validations:
      required: false
  - type: textarea
    id: attachments
    attributes:
      label: Screenshots or diagnostic logs
      description: Attach files here after reviewing their contents and removing sensitive information.
    validations:
      required: false
